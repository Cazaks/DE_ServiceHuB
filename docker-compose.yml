services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: servicemarketplace
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://appuser:devpassword@db:5432/servicemarketplace

volumes:
  postgres_data: