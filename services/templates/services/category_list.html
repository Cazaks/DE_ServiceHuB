<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Services</title>
</head>
<body>
    <h1>Our Services</h1>
    <ul>
        {% for category in categories %}
            <li><a href="{% url 'category_detail' category.pk %}">{{ category.name }}</a></li>
        {% empty %}
            <li>No services available yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
